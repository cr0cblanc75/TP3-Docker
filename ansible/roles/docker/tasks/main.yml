---
# Tasks for installing and configuring Docker

- name: Verify supported operating system
  ansible.builtin.assert:
      # Ensure the OS is supported
      that:
          - ansible_distribution in ['Debian', 'Ubuntu']
      fail_msg: "This role supports Debian and Ubuntu only."

- name: Install prerequisites
  ansible.builtin.apt:
      # Install required packages
      name:
          - ca-certificates
          - curl
      state: present
      update_cache: true

- name: Create APT keyrings directory
  ansible.builtin.file:
      # Create the directory for repository keys
      path: /etc/apt/keyrings
      state: directory
      mode: "0755"

- name: Download Docker official GPG key
  ansible.builtin.get_url:
      # Download the official Docker signing key
      url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
      dest: /etc/apt/keyrings/docker.asc
      mode: "0644"

- name: Get OS release codename
  ansible.builtin.shell: |
      # Read the OS release codename
      . /etc/os-release
      printf '%s' "$VERSION_CODENAME"
  args:
      executable: /bin/sh
  register: docker_release
  # This command does not change the system
  changed_when: false

- name: Verify OS release codename
  ansible.builtin.assert:
      # Ensure the codename was detected
      that:
          - docker_release.stdout | length > 0
      fail_msg: "Could not detect the OS release codename."

- name: Get package architecture
  ansible.builtin.command: dpkg --print-architecture
  # This command does not change the system
  register: docker_architecture
  changed_when: false

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
      # Configure the official Docker repository
      repo: >-
          deb [arch={{ docker_architecture.stdout }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ docker_release.stdout }} stable
      filename: docker
      state: present
      update_cache: true

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
      # Install Docker and its plugins
      name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
      state: present
      update_cache: true

- name: Ensure Docker is running and enabled
  ansible.builtin.service:
      # Start Docker and enable it at boot
      name: docker
      state: started
      enabled: true
