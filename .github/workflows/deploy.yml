name: Deploy with Ansible

on:
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read

jobs:
    prepare:
        name: Prepare and validate Ansible
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Install Ansible
              run: |
                  python -m pip install --upgrade pip
                  pip install ansible
                  ansible-galaxy collection install community.docker

            - name: Check playbook syntax
              run: |
                  cd ansible
                  ansible-playbook \
                    -i inventories/setup.yml \
                    playbooks/playbook.yml \
                    --syntax-check

    test-ssh:
        name: Test SSH connection
        runs-on: ubuntu-latest

        steps:
            - name: Configure SSH
              env:
                  SSH: ${{ secrets.SSH }}
                  SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  printf '%s\n' "$SSH" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa

                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Test connection
              run: |
                  ssh -o BatchMode=yes \
                      -o StrictHostKeyChecking=yes \
                      -i ~/.ssh/id_rsa \
                      admin@eugene.lallain.takima.school \
                      "echo SSH_OK"

    deploy:
        name: Deploy application
        runs-on: ubuntu-latest
        needs:
            - prepare
            - test-ssh

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Install Ansible
              run: |
                  python -m pip install --upgrade pip
                  pip install ansible
                  ansible-galaxy collection install community.docker

            - name: Configure SSH
              env:
                  SSH: ${{ secrets.SSH }}
                  SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  printf '%s\n' "$SSH" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa

                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Deploy with Ansible
              env:
                  DB_NAME: ${{ secrets.DB_NAME }}
                  DB_USER: ${{ secrets.DB_USER }}
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: |
                  cd ansible
                  ansible-playbook \
                    -i inventories/setup.yml \
                    playbooks/playbook.yml \
                    --private-key ~/.ssh/id_rsa
